<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>露珠小院</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
    background: #f5f5f5;
    min-height: 100vh;
    padding: 16px;
  }
  .app { max-width: 960px; margin: 0 auto; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .topbar h1 { font-size: 1.2rem; font-weight: 600; }
  .stats { display: flex; gap: 12px; font-size: 0.9rem; }
  .stage {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 12px;
  }
  .garden-panel, .card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
  }
  .garden-panel h2, .card h3 {
    font-size: 1rem;
    margin-bottom: 12px;
  }
  .hint { font-size: 0.8rem; color: #888; margin-bottom: 12px; }
  .plots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .plot {
    aspect-ratio: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #f0ebe3;
    cursor: pointer;
    font: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: #666;
  }
  .plot.selected { outline: 2px solid #4a90a4; }
  .plot.wet { background: #d8d0c4; }
  .seed-list { display: flex; flex-direction: column; gap: 8px; }
  .seed-btn {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 6px;
    padding: 8px 10px;
    text-align: left;
    cursor: pointer;
    font: inherit;
  }
  .seed-btn.active { border-color: #4a90a4; background: #eef6f8; }
  .log-body {
    font-size: 0.8rem;
    color: #666;
    max-height: 160px;
    overflow-y: auto;
  }
  .log-body p { margin-bottom: 6px; }
  .log-body p em {
    font-style: normal;
    color: #999;
    margin-right: 4px;
    font-size: 0.75rem;
  }
  .dock {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }
  .action {
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    font: inherit;
  }
  .action.primary {
    background: #4a90a4;
    border-color: #4a90a4;
    color: #fff;
  }
  .action:disabled { opacity: 0.45; cursor: not-allowed; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .intro {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: grid;
    place-items: center;
    z-index: 10;
  }
  .intro.hide { display: none; }
  .intro-card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: min(360px, 90vw);
    text-align: center;
  }
  .intro-card h2 { margin-bottom: 8px; }
  .intro-card p { color: #666; font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; }
  .intro-card .start {
    border: none;
    background: #4a90a4;
    color: #fff;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
  }
  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="intro" id="intro">
    <div class="intro-card">
      <h2>露珠小院</h2>
      <p>选种子、点空地播种，浇水过夜后收获。</p>
      <button class="start" id="startBtn" type="button">开始</button>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <h1>露珠小院</h1>
      <div class="stats">
        <span>金币 <span id="coins">48</span></span>
        <span>体力 <span id="energy">12</span>/<span id="energyMax">16</span></span>
        <span>第 <span id="day">1</span> 天</span>
      </div>
    </header>

    <main class="stage">
      <section class="garden-panel">
        <h2>南窗花圃</h2>
        <p class="hint" id="statusHint">先选种子，再点空地播种</p>
        <div class="plots" id="plots"></div>
      </section>
      <aside>
        <div class="card" style="margin-bottom:12px">
          <h3>种子袋</h3>
          <div class="seed-list" id="seedList"></div>
        </div>
        <div class="card">
          <h3>小院手记</h3>
          <div class="log-body" id="log"></div>
        </div>
      </aside>
    </main>

    <nav class="dock">
      <button class="action" id="btnWater" type="button">浇水</button>
      <button class="action primary" id="btnHarvest" type="button">收获</button>
      <button class="action" id="btnRest" type="button">过夜</button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const SEEDS = {
      blush: { id: "blush", name: "胭脂芽", cost: 8 },
      mint: { id: "mint", name: "薄荷铃", cost: 6 },
    };

    const stageLabel = ["嫩芽", "花苞", "盛开"];

    const state = {
      coins: 48,
      energy: 12,
      maxEnergy: 16,
      day: 1,
      selectedSeed: "blush",
      selectedPlot: null,
      inventory: { blush: 3, mint: 2 },
      plots: Array.from({ length: 9 }, (_, i) => ({ id: i, plant: null })),
    };

    const el = {
      plots: document.getElementById("plots"),
      seedList: document.getElementById("seedList"),
      log: document.getElementById("log"),
      coins: document.getElementById("coins"),
      energy: document.getElementById("energy"),
      energyMax: document.getElementById("energyMax"),
      day: document.getElementById("day"),
      hint: document.getElementById("statusHint"),
      toast: document.getElementById("toast"),
      intro: document.getElementById("intro"),
      startBtn: document.getElementById("startBtn"),
      btnWater: document.getElementById("btnWater"),
      btnHarvest: document.getElementById("btnHarvest"),
      btnRest: document.getElementById("btnRest"),
    };

    let toastTimer = null;
    function toast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1800);
    }

    function log(msg) {
      const p = document.createElement("p");
      const t = new Date();
      const stamp = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
      p.innerHTML = `<em>${stamp}</em>${msg}`;
      el.log.prepend(p);
    }

    function spendEnergy(n) {
      if (state.energy < n) {
        toast("体力不太够了，歇息一夜再来吧");
        return false;
      }
      state.energy -= n;
      return true;
    }

    function renderSeeds() {
      el.seedList.innerHTML = "";
      Object.values(SEEDS).forEach((seed) => {
        const count = state.inventory[seed.id] || 0;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seed-btn" + (state.selectedSeed === seed.id ? " active" : "");
        btn.textContent = `${seed.name} ×${count}`;
        btn.addEventListener("click", () => {
          state.selectedSeed = seed.id;
          el.hint.textContent = `已选「${seed.name}」——点空地即可播种`;
          renderSeeds();
        });
        el.seedList.appendChild(btn);
      });
    }

    function plotLabel(plot) {
      if (!plot.plant) return "空地";
      const s = SEEDS[plot.plant.seedId];
      return `${s.name}·${stageLabel[plot.plant.stage]}`;
    }

    function renderPlots() {
      el.plots.innerHTML = "";
      state.plots.forEach((plot) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "plot";
        if (state.selectedPlot === plot.id) btn.classList.add("selected");
        if (plot.plant?.wateredToday) btn.classList.add("wet");
        btn.textContent = plotLabel(plot);
        btn.addEventListener("click", () => onPlotClick(plot.id));
        el.plots.appendChild(btn);
      });
      updateHud();
    }

    function updateHud() {
      el.coins.textContent = state.coins;
      el.energy.textContent = state.energy;
      el.energyMax.textContent = state.maxEnergy;
      el.day.textContent = state.day;
      const sel = state.selectedPlot != null ? state.plots[state.selectedPlot] : null;
      el.btnWater.disabled = !sel || !sel.plant || sel.plant.stage >= 2;
      el.btnHarvest.disabled = !sel || !sel.plant || sel.plant.stage < 2;
    }

    function onPlotClick(id) {
      const plot = state.plots[id];
      state.selectedPlot = id;

      if (!plot.plant) {
        const seedId = state.selectedSeed;
        const count = state.inventory[seedId] || 0;
        if (count <= 0) {
          toast("这种子用完了，收获后再来吧");
          renderPlots();
          return;
        }
        if (!spendEnergy(1)) {
          renderPlots();
          return;
        }
        state.inventory[seedId] -= 1;
        plot.plant = { seedId, stage: 0, wateredToday: false };
        log(`在第 ${id + 1} 块地播下了「${SEEDS[seedId].name}」`);
        toast(`种下了 ${SEEDS[seedId].name}`);
        el.hint.textContent = "选中植株后点「浇水」，让它慢慢长大";
        renderSeeds();
        renderPlots();
        return;
      }

      el.hint.textContent =
        plot.plant.stage >= 2
          ? "这朵花已经盛开，可以收获了"
          : plot.plant.wateredToday
            ? "今天浇过水了，过夜后会继续生长"
            : "点下方「浇水」，帮它喝一口露珠";
      renderPlots();
    }

    el.btnWater.addEventListener("click", () => {
      if (state.selectedPlot == null) {
        toast("先点选一块有植株的地");
        return;
      }
      const plot = state.plots[state.selectedPlot];
      if (!plot.plant) {
        toast("空地还不需要浇水");
        return;
      }
      if (plot.plant.stage >= 2) {
        toast("已经盛开啦，直接收获吧");
        return;
      }
      if (plot.plant.wateredToday) {
        toast("今天已经浇过了，明天再来");
        return;
      }
      if (!spendEnergy(1)) return;

      plot.plant.wateredToday = true;
      log(`给「${SEEDS[plot.plant.seedId].name}」浇了一瓢清凉的水`);
      toast("浇水完成");
      el.hint.textContent = "土变湿了。点「过夜」，花会悄悄长大";
      renderPlots();
    });

    el.btnHarvest.addEventListener("click", () => {
      if (state.selectedPlot == null) {
        toast("先点选一朵盛开的花");
        return;
      }
      const plot = state.plots[state.selectedPlot];
      if (!plot.plant || plot.plant.stage < 2) {
        toast("还没盛开，再等等");
        return;
      }
      if (!spendEnergy(1)) return;

      const seed = SEEDS[plot.plant.seedId];
      const gain = seed.cost + 4;
      const seedGain = 1 + (Math.random() > 0.55 ? 1 : 0);
      state.coins += gain;
      state.inventory[seed.id] = (state.inventory[seed.id] || 0) + seedGain;
      log(`收获「${seed.name}」，+${gain} 金币，种子 +${seedGain}`);
      toast(`收获啦 · +${gain}`);
      plot.plant = null;
      el.hint.textContent = "花圃空出来了，可以再种一颗";
      renderSeeds();
      renderPlots();
    });

    el.btnRest.addEventListener("click", () => {
      state.day += 1;
      state.energy = state.maxEnergy;
      let grew = 0;
      state.plots.forEach((p) => {
        if (p.plant && p.plant.wateredToday && p.plant.stage < 2) {
          p.plant.stage += 1;
          p.plant.wateredToday = false;
          grew += 1;
        } else if (p.plant) {
          p.plant.wateredToday = false;
        }
      });
      log(
        grew
          ? `天亮了。有 ${grew} 株植物又长高了一点`
          : "天亮了。今天的花圃静悄悄的"
      );
      toast(`第 ${state.day} 天 · 体力已回满`);
      el.hint.textContent = grew
        ? "有花长大了，去看看吧"
        : "新的一天，浇浇水或种种新种子";
      renderPlots();
    });

    el.startBtn.addEventListener("click", () => {
      el.intro.classList.add("hide");
      log("推开院门，晨光落在南窗花圃上");
    });

    state.plots[4].plant = { seedId: "blush", stage: 1, wateredToday: false };
    renderSeeds();
    renderPlots();
    log("小院已经准备好了，等你来照料");
  </script>
</body>
</html>
