<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>露珠小院 · Dewdrop Courtyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --sky-top: #d8efe8;
    --sky-mid: #eef7f2;
    --sky-bottom: #f7f3ea;
    --leaf: #6faf8e;
    --leaf-deep: #4d8a6a;
    --mint: #b8dfc9;
    --mint-soft: #e4f4eb;
    --paper: #fffdf8;
    --blush: #f3c4c0;
    --ink: #3d4a42;
    --ink-soft: #6b7a71;
    --ink-mute: #9aaba1;
    --soil: #c9b29a;
    --soil-wet: #a89078;
    --shadow: rgba(77, 110, 90, 0.12);
    --radius-lg: 22px;
    --radius-md: 16px;
    --font-display: "ZCOOL XiaoWei", "Songti SC", serif;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --pad: 12px;
    --dock-h: 72px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --surface: rgba(255, 253, 248, 0.82);
    --surface-soft: rgba(255, 253, 248, 0.6);
    --border-soft: rgba(255,255,255,0.85);
    --chip-bg: var(--mint-soft);
    --chip-border: rgba(111,175,142,0.22);
    --chip-color: var(--leaf-deep);
    --gold-bg: #fff6e4;
    --gold-border: rgba(232,194,122,0.45);
    --gold-color: #9a7428;
    --day-bg: #eef4ff;
    --day-border: rgba(140,170,220,0.35);
    --day-color: #5a6f96;
    --seed-active-bg: #dff3e8;
    --seed-press: #d5efdf;
    --log-item-bg: rgba(255,255,255,0.55);
    --weather-bg: rgba(255,255,255,0.65);
    --plot-label-bg: rgba(255,255,255,0.5);
    --plot-label-color: rgba(80, 60, 40, 0.7);
    --dock-fade: linear-gradient(180deg, transparent, rgba(238, 247, 242, 0.92) 28%, rgba(247, 243, 234, 0.96));
    --dock-bg: rgba(255, 253, 248, 0.92);
    --action-bg: var(--mint-soft);
    --action-color: var(--leaf-deep);
    --sheet-bg: var(--paper);
    --mask-bg: rgba(50, 70, 60, 0.28);
    --intro-bg: rgba(232, 245, 238, 0.88);
    --theme-transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    color-scheme: light;
  }

  /* 小清新夜色：雾蓝夜空 + 薄荷月光 */
  html.night {
    color-scheme: dark;
    --sky-top: #1a2430;
    --sky-mid: #1e2a36;
    --sky-bottom: #243040;
    --leaf: #7ec4a0;
    --leaf-deep: #a8dcc0;
    --mint: #5a8f78;
    --mint-soft: rgba(90, 140, 115, 0.28);
    --paper: #243038;
    --blush: #d4a09c;
    --ink: #e6efe9;
    --ink-soft: #b0c0b6;
    --ink-mute: #7d9086;
    --soil: #6b5a48;
    --soil-wet: #564738;
    --shadow: rgba(0, 0, 0, 0.35);
    --surface: rgba(36, 48, 56, 0.88);
    --surface-soft: rgba(32, 42, 52, 0.72);
    --border-soft: rgba(140, 180, 160, 0.14);
    --chip-bg: rgba(90, 140, 115, 0.22);
    --chip-border: rgba(126, 196, 160, 0.28);
    --chip-color: #b8e0c8;
    --gold-bg: rgba(180, 140, 60, 0.22);
    --gold-border: rgba(220, 180, 90, 0.35);
    --gold-color: #e8c878;
    --day-bg: rgba(100, 130, 180, 0.22);
    --day-border: rgba(140, 170, 220, 0.3);
    --day-color: #b8c8e8;
    --seed-active-bg: rgba(90, 150, 120, 0.35);
    --seed-press: rgba(90, 150, 120, 0.28);
    --log-item-bg: rgba(0, 0, 0, 0.22);
    --weather-bg: rgba(0, 0, 0, 0.22);
    --plot-label-bg: rgba(0, 0, 0, 0.35);
    --plot-label-color: rgba(230, 220, 200, 0.78);
    --dock-fade: linear-gradient(180deg, transparent, rgba(20, 28, 36, 0.55) 30%, rgba(20, 28, 36, 0.92));
    --dock-bg: rgba(28, 38, 46, 0.94);
    --action-bg: rgba(50, 70, 62, 0.75);
    --action-color: #c8e8d4;
    --sheet-bg: #243038;
    --mask-bg: rgba(8, 12, 18, 0.55);
    --intro-bg: rgba(20, 30, 38, 0.9);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
  }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(184, 223, 201, 0.55), transparent 55%),
      radial-gradient(ellipse 60% 40% at 85% 20%, rgba(243, 196, 192, 0.28), transparent 50%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-bottom) 100%);
    background-attachment: fixed;
    min-height: 100%;
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    transition: var(--theme-transition);
  }
  html.night body {
    background:
      radial-gradient(ellipse 70% 45% at 18% 8%, rgba(90, 140, 160, 0.22), transparent 55%),
      radial-gradient(ellipse 50% 35% at 88% 18%, rgba(120, 100, 160, 0.14), transparent 50%),
      radial-gradient(circle at 72% 12%, rgba(255, 245, 210, 0.14) 0 1.1%, transparent 2%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
  }
  html.night .orb.a { background: #eef6ff; opacity: 0.45; }
  html.night .orb.b { background: #7ec4a0; }
  html.night .orb.c { background: rgba(220, 235, 255, 0.7); }
  html.night .orb.d { background: #c9a0c0; }
  html.night .cloud { background: rgba(160, 180, 200, 0.18); }
  html.night .garden-sky {
    background:
      radial-gradient(circle at 78% 22%, rgba(255, 245, 210, 0.38) 0 2.2%, transparent 3.2%),
      linear-gradient(180deg, rgba(40, 55, 75, 0.55), transparent 85%) !important;
  }
  html.night .garden-panel.theme-mist {
    background: linear-gradient(180deg, rgba(36, 48, 62, 0.85), rgba(32, 42, 52, 0.72));
  }
  html.night .garden-panel.theme-mist .garden-sky {
    background:
      radial-gradient(circle at 78% 22%, rgba(200, 220, 255, 0.2) 0 2%, transparent 3%),
      linear-gradient(180deg, #1c2838 0%, #243040 55%, transparent 100%) !important;
  }
  html.night .garden-panel.theme-river {
    background: linear-gradient(180deg, rgba(28, 48, 52, 0.85), rgba(32, 42, 52, 0.72));
  }
  html.night .garden-panel.theme-river .garden-sky {
    background:
      radial-gradient(circle at 78% 22%, rgba(180, 230, 240, 0.18) 0 2%, transparent 3%),
      linear-gradient(180deg, #1a3038 0%, #223840 55%, transparent 100%) !important;
  }
  html.night .region-card {
    background: linear-gradient(135deg, rgba(40, 52, 60, 0.98), rgba(50, 70, 62, 0.45));
    border-color: rgba(126, 196, 160, 0.22);
  }
  html.night .region-card.theme-mist {
    background: linear-gradient(135deg, #2a3440, #243040);
    border-color: rgba(140, 165, 190, 0.3);
  }
  html.night .region-card.theme-river {
    background: linear-gradient(135deg, #243840, #1e3438);
    border-color: rgba(100, 170, 185, 0.3);
  }
  html.night .region-card .tag {
    background: rgba(0, 0, 0, 0.25);
  }
  html.night .plot-inner {
    border-color: rgba(120, 100, 80, 0.35);
  }
  html.night .empty-mark {
    border-color: rgba(200, 190, 170, 0.25);
  }
  html.night .seed-count {
    background: rgba(0, 0, 0, 0.28);
  }
  html.night .seed-icon {
    background: rgba(30, 40, 48, 0.9);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  html.night .toast {
    background: rgba(220, 235, 225, 0.95);
    color: #1e2a24;
  }
  html.night .intro-card {
    border-color: rgba(140, 180, 160, 0.18);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  }

  .ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.55;
    animation: floaty ease-in-out infinite;
  }
  .orb.a { width: 10px; height: 10px; background: #fff; left: 12%; top: 18%; animation-duration: 9s; }
  .orb.b { width: 7px; height: 7px; background: var(--mint); left: 78%; top: 28%; animation-duration: 11s; animation-delay: -2s; }
  .orb.c { width: 12px; height: 12px; background: rgba(255,255,255,0.8); left: 55%; top: 12%; animation-duration: 13s; animation-delay: -4s; }
  .orb.d { width: 6px; height: 6px; background: var(--blush); left: 30%; top: 40%; animation-duration: 10s; animation-delay: -1s; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.35; }
    50% { transform: translateY(-18px) translateX(8px); opacity: 0.75; }
  }

  /* —— app shell: mobile-first column —— */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    min-height: 100dvh;
    padding:
      calc(var(--safe-t) + var(--pad))
      var(--pad)
      calc(var(--dock-h) + var(--safe-b) + 16px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* —— top bar —— */
  .topbar {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    padding: 10px 12px;
    box-shadow: 0 8px 24px var(--shadow);
    flex-shrink: 0;
    transition: var(--theme-transition);
  }
  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
  }
  .theme-toggle {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--chip-color);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: var(--theme-transition), transform 0.15s ease;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .theme-toggle:active { transform: scale(0.95); }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--leaf);
    outline-offset: 2px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #fff 0 18%, transparent 19%),
      radial-gradient(circle at 50% 55%, #9fd4b5 0 42%, #6faf8e 43% 70%, #4d8a6a 71%);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.08), 0 4px 10px rgba(111,175,142,0.35);
    position: relative;
    flex-shrink: 0;
  }
  .logo::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 10px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: rgba(255,255,255,0.85);
    right: 7px;
    top: 7px;
    transform: rotate(18deg);
  }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    line-height: 1.15;
  }
  .brand p {
    display: none;
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }
  .stats {
    display: flex;
    gap: 6px;
    width: 100%;
  }
  .chip {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 999px;
    padding: 7px 6px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--chip-color);
    white-space: nowrap;
    min-width: 0;
    transition: var(--theme-transition);
  }
  .chip.gold {
    background: var(--gold-bg);
    border-color: var(--gold-border);
    color: var(--gold-color);
  }
  .chip.day {
    background: var(--day-bg);
    border-color: var(--day-border);
    color: var(--day-color);
  }
  .chip .icon { font-size: 0.9rem; line-height: 1; flex-shrink: 0; }

  /* —— stage: stacked on mobile —— */
  .stage {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }

  .garden-panel {
    position: relative;
    background: var(--surface-soft);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 28px var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: var(--theme-transition);
  }
  .garden-sky {
    position: absolute;
    inset: 0 0 40% 0;
    background:
      radial-gradient(circle at 78% 28%, rgba(255,255,255,0.7) 0 8%, transparent 9%),
      linear-gradient(180deg, rgba(190, 226, 214, 0.5), transparent 80%);
    pointer-events: none;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 999px;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud.c1 {
    width: 60px; height: 18px; top: 16%; left: -80px;
    animation-duration: 42s;
  }
  .cloud.c1::before { width: 24px; height: 24px; top: -12px; left: 10px; }
  .cloud.c1::after { width: 30px; height: 26px; top: -14px; left: 26px; }
  .cloud.c2 {
    width: 80px; height: 22px; top: 28%; left: -120px;
    animation-duration: 56s; animation-delay: -20s; opacity: 0.7;
  }
  .cloud.c2::before { width: 30px; height: 30px; top: -14px; left: 14px; }
  .cloud.c2::after { width: 36px; height: 32px; top: -16px; left: 34px; }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  .garden-header {
    position: relative;
    z-index: 2;
    padding: 12px 12px 6px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .garden-header h2 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 400;
  }
  .garden-header .hint {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 2px;
    line-height: 1.35;
    max-width: 14em;
  }
  .weather {
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--weather-bg);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.72rem;
    color: var(--ink-soft);
    border: 1px solid var(--border-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .plots {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(6px, 2vw, 12px);
    padding: 6px 12px 14px;
    width: 100%;
    max-width: min(100%, 420px);
    margin: 0 auto;
  }

  .plot {
    aspect-ratio: 1;
    border: none;
    background: transparent;
    cursor: pointer;
    position: relative;
    padding: 0;
    font: inherit;
    color: inherit;
    border-radius: 16px;
    transition: transform 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .plot:active { transform: scale(0.97); }
  .plot:focus-visible {
    outline: 2px solid var(--leaf);
    outline-offset: 2px;
  }
  .plot-inner {
    width: 100%;
    height: 100%;
    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(180deg, #e8d7c2 0%, var(--soil) 55%, #b79a7e 100%);
    border: 2px solid rgba(255,255,255,0.55);
    box-shadow:
      inset 0 6px 12px rgba(255,255,255,0.25),
      inset 0 -8px 14px rgba(120, 90, 60, 0.12),
      0 6px 14px rgba(120, 100, 70, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 12%;
    position: relative;
    overflow: hidden;
  }
  .plot.wet .plot-inner {
    background:
      linear-gradient(180deg, rgba(160,200,180,0.2), transparent 35%),
      linear-gradient(180deg, #d4c0a8 0%, var(--soil-wet) 55%, #8f755c 100%);
  }
  .plot.selected .plot-inner {
    box-shadow:
      inset 0 6px 12px rgba(255,255,255,0.25),
      0 0 0 3px rgba(111,175,142,0.55),
      0 8px 18px rgba(111,175,142,0.2);
  }

  .plant {
    position: absolute;
    left: 50%;
    bottom: 26%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .sprout {
    width: 9px;
    height: 16px;
    background: linear-gradient(180deg, #8fd0a6, #5a9a74);
    border-radius: 8px 8px 2px 2px;
    position: relative;
  }
  .sprout::before, .sprout::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 8px;
    background: #7fc494;
    border-radius: 50% 0 50% 50%;
    top: 2px;
  }
  .sprout::before { left: -9px; transform: rotate(-30deg); }
  .sprout::after { right: -9px; transform: scaleX(-1) rotate(-30deg); border-radius: 0 50% 50% 50%; }

  .bud { width: 20px; height: 26px; position: relative; }
  .bud .stem {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 4px;
    height: 16px;
    background: linear-gradient(180deg, #7fc494, #4d8a6a);
    border-radius: 3px;
    transform: translateX(-50%);
  }
  .bud .head {
    position: absolute;
    left: 50%;
    top: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff5, transparent 40%),
                radial-gradient(circle at 50% 50%, #f7b8b4, #e88984);
    transform: translateX(-50%);
    box-shadow: 0 2px 6px rgba(200,100,100,0.2);
  }

  .bloom { width: 42px; height: 42px; position: relative; }
  .bloom .stem {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 5px;
    height: 18px;
    background: linear-gradient(180deg, #8fd0a6, #4d8a6a);
    border-radius: 3px;
    transform: translateX(-50%);
  }
  .bloom .petal {
    position: absolute;
    width: 14px;
    height: 18px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    left: 50%;
    top: 3px;
    transform-origin: center 16px;
  }
  .bloom .petal:nth-child(1) { background: #f6c8c4; transform: translateX(-50%) rotate(0deg); }
  .bloom .petal:nth-child(2) { background: #f3b7b2; transform: translateX(-50%) rotate(72deg); }
  .bloom .petal:nth-child(3) { background: #f6c8c4; transform: translateX(-50%) rotate(144deg); }
  .bloom .petal:nth-child(4) { background: #f3b7b2; transform: translateX(-50%) rotate(216deg); }
  .bloom .petal:nth-child(5) { background: #f8d4d0; transform: translateX(-50%) rotate(288deg); }
  .bloom .center {
    position: absolute;
    left: 50%;
    top: 10px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9a8, #e8c27a);
    transform: translateX(-50%);
    z-index: 2;
  }
  .bloom.mint .petal:nth-child(1),
  .bloom.mint .petal:nth-child(3),
  .bloom.mint .petal:nth-child(5) { background: #b8dfc9; }
  .bloom.mint .petal:nth-child(2),
  .bloom.mint .petal:nth-child(4) { background: #9fd4b5; }

  .plot-label {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.58rem;
    color: var(--plot-label-color);
    background: var(--plot-label-bg);
    padding: 1px 5px;
    border-radius: 999px;
    white-space: nowrap;
    max-width: 92%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-mark {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 22px;
    height: 22px;
    border: 2px dashed rgba(120, 100, 80, 0.28);
    border-radius: 50%;
    opacity: 0.7;
  }

<body>
  <div class="ambient" aria-hidden="true">

  <div class="intro" id="intro">

        if (preferNight) document.documentElement.classList.add("night");

    })();

    const SEEDS = {
      blush: {

        name: "水仙芽",
        icon: "🌼",
        desc: "淡黄花瓣，爱湿润砂土",
        cost: 12,
        bloomColor: "river",
      },
    };

    const REGIONS = {
      home: {
        id: "home",
        name: "南窗花圃",
        desc: "小院里最熟悉的那块地，适合胭脂芽与薄荷铃。",
        weather: "☁ 微风 · 适宜生长",
        theme: "home",
        unlockDay: 1,
        travelCost: 0,
        plotCount: 9,
        seedIds: ["blush", "mint"],
        harvestBonus: 0,
      },
      mist: {
        id: "mist",
        name: "雾丘浅坡",
        desc: "山腰常年挂着轻雾，雾铃草在这里长得最稳。",
        weather: "🌫 薄雾 · 生长缓慢而扎实",
        theme: "mist",
        unlockDay: 2,
        travelCost: 2,
        plotCount: 6,
        seedIds: ["mist"],
        harvestBonus: 2,
      },
      river: {
        id: "river",
        name: "浅滩河岸",
        desc: "河水带来的砂土，水仙芽一夜之间就更精神。",
        weather: "💧 湿润 · 一夜长得更快",
        theme: "river",
        unlockDay: 3,
        travelCost: 2,
        plotCount: 6,
        seedIds: ["river"],
        harvestBonus: 3,
        doubleGrowthChance: 0.35,
      },
    };

    function makePlots(n) {
      return Array.from({ length: n }, (_, i) => ({ id: i, plant: null }));
    }

    const state = {
      coins: 48,
      energy: 12,
      maxEnergy: 16,
      day: 1,
      regionId: "home",
      selectedSeed: "blush",
      selectedPlot: null,
      inventory: { blush: 3, mint: 2, mist: 1, river: 1 },
      regionPlots: {
        home: makePlots(9),
        mist: makePlots(6),
        river: makePlots(6),
      },
    };

    // starter plant in home center
    state.regionPlots.home[4].plant = {
      seedId: "blush",
      stage: 1,
      wateredToday: false,
    };

    const stageLabel = ["嫩芽", "花苞", "盛开"];

    const el = {
      plots: document.getElementById("plots"),
      seedList: document.getElementById("seedList"),
      log: document.getElementById("log"),
      coins: document.getElementById("coins"),
      energy: document.getElementById("energy"),
      energyMax: document.getElementById("energyMax"),
      day: document.getElementById("day"),
      hint: document.getElementById("statusHint"),
      toast: document.getElementById("toast"),
      intro: document.getElementById("intro"),
      startBtn: document.getElementById("startBtn"),
      btnWater: document.getElementById("btnWater"),
      btnHarvest: document.getElementById("btnHarvest"),
      btnRest: document.getElementById("btnRest"),
      btnTravel: document.getElementById("btnTravel"),
      btnCloseMap: document.getElementById("btnCloseMap"),
      sheetMask: document.getElementById("sheetMask"),
      mapSheet: document.getElementById("mapSheet"),
      regionList: document.getElementById("regionList"),
      regionTitle: document.getElementById("regionTitle"),
      regionWeather: document.getElementById("regionWeather"),
      gardenPanel: document.getElementById("gardenPanel"),
      btnTheme: document.getElementById("btnTheme"),
    };

    function isNight() {
      return document.documentElement.classList.contains("night");
    }

    function applyTheme(night) {
      document.documentElement.classList.toggle("night", !!night);
      if (el.btnTheme) {
        el.btnTheme.textContent = night ? "☀" : "🌙";
        el.btnTheme.setAttribute("aria-label", night ? "切换日间模式" : "切换黑夜模式");
        el.btnTheme.title = night ? "日间模式" : "黑夜模式";
      }
      try {
        localStorage.setItem("dewdrop-theme", night ? "night" : "day");
      } catch (e) {}
    }

    function toggleTheme() {
      const next = !isNight();
      applyTheme(next);
      toast(next ? "夜色轻柔，月光落在花圃上" : "晨光回来了");
      log(next ? "点亮了夜色模式" : "切回日间模式");
    }

    function currentRegion() {
      return REGIONS[state.regionId];
    }

    function currentPlots() {
      return state.regionPlots[state.regionId];
    }

    function isUnlocked(region) {
      return state.day >= region.unlockDay;
    }

    let toastTimer = null;
    function toast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1800);
    }

    function log(msg) {
      const p = document.createElement("p");
      const t = new Date();
      const stamp = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
      p.innerHTML = `<em>${stamp}</em>${msg}`;
      el.log.prepend(p);
    }

    function spendEnergy(n) {
      if (state.energy < n) {
        toast("体力不太够了，歇息一夜再来吧");
        return false;
      }
      state.energy -= n;
      return true;
    }

    function openMap() {
      renderRegionList();
      el.sheetMask.hidden = false;
      el.mapSheet.hidden = false;
      requestAnimationFrame(() => {
        el.sheetMask.classList.add("open");
        el.mapSheet.classList.add("open");
      });
    }

    function closeMap() {
      el.sheetMask.classList.remove("open");
      el.mapSheet.classList.remove("open");
      setTimeout(() => {
        el.sheetMask.hidden = true;
        el.mapSheet.hidden = true;
      }, 300);
    }

    function renderRegionList() {
      el.regionList.innerHTML = "";
      Object.values(REGIONS).forEach((region) => {
        const unlocked = isUnlocked(region);
        const here = state.regionId === region.id;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className =
          "region-card theme-" +
          region.theme +
          (here ? " current" : "") +
          (!unlocked ? " locked" : "");

        let status = "前往";
        if (!unlocked) status = `第 ${region.unlockDay} 天解锁`;
        else if (here) status = "当前";
        else if (region.travelCost > 0) status = `体力 −${region.travelCost}`;
        else status = "回家";

        const seedNames = region.seedIds.map((id) => SEEDS[id].name).join("、");
        btn.innerHTML = `
          <div class="r-name">${region.name}</div>
          <div class="r-status">${status}</div>
          <div class="r-desc">${region.desc}</div>
          <div class="r-meta">
            <span class="tag">${region.weather}</span>
            <span class="tag">${region.plotCount} 格</span>
            <span class="tag">作物 · ${seedNames}</span>
          </div>
        `;
        btn.addEventListener("click", () => travelTo(region.id));
        el.regionList.appendChild(btn);
      });
    }

    function travelTo(regionId) {
      const region = REGIONS[regionId];
      if (!region) return;
      if (state.regionId === regionId) {
        toast("已经在这里啦");
        closeMap();
        return;
      }
      if (!isUnlocked(region)) {
        toast(`再过几天吧——第 ${region.unlockDay} 天才能去`);
        return;
      }
      if (region.travelCost > 0 && !spendEnergy(region.travelCost)) return;

      state.regionId = regionId;
      state.selectedPlot = null;
      // pick first available seed for this region if current not plantable
      if (!region.seedIds.includes(state.selectedSeed)) {
        state.selectedSeed = region.seedIds[0];
      }
      log(
        region.id === "home"
          ? "推开院门，回到了南窗花圃"
          : `步行前往「${region.name}」${region.travelCost ? `（体力 −${region.travelCost}）` : ""}`
      );
      toast(region.id === "home" ? "回到小院" : `抵达 ${region.name}`);
      el.hint.textContent = `这里适合种：${region.seedIds.map((id) => SEEDS[id].name).join("、")}`;
      closeMap();
      renderAll();
    }

    function renderRegionChrome() {
      const region = currentRegion();
      el.regionTitle.textContent = region.name;
      el.regionWeather.textContent = region.weather;
      el.gardenPanel.className = "garden-panel theme-" + region.theme;
      el.plots.setAttribute("aria-label", region.name + "花圃");
    }

    function renderSeeds() {
      el.seedList.innerHTML = "";
      const region = currentRegion();
      region.seedIds.forEach((seedId) => {
        const seed = SEEDS[seedId];
        const count = state.inventory[seed.id] || 0;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seed-btn" + (state.selectedSeed === seed.id ? " active" : "");
        btn.innerHTML = `
          <div class="seed-top">
            <div class="seed-icon">${seed.icon}</div>
            <div class="seed-meta">
              <strong>${seed.name}</strong>
              <small>${seed.desc}</small>
            </div>
            <div class="seed-count">×${count}</div>
          </div>
        `;
        btn.addEventListener("click", () => {
          state.selectedSeed = seed.id;
          el.hint.textContent = `已选「${seed.name}」——点空地即可播种`;
          renderSeeds();
        });
        el.seedList.appendChild(btn);
      });
    }

    function plantHTML(plant) {
      if (!plant) return '<div class="empty-mark" aria-hidden="true"></div>';
      if (plant.stage === 0) {
        return `<div class="plant" aria-hidden="true"><div class="sprout"></div></div>`;
      }
      if (plant.stage === 1) {
        return `<div class="plant" aria-hidden="true"><div class="bud"><div class="stem"></div><div class="head"></div></div></div>`;
      }
      const color = SEEDS[plant.seedId].bloomColor;
      const colorClass =
        color === "mint" ? "mint" : color === "mist" ? "mist" : color === "river" ? "river" : "";
      return `<div class="plant" aria-hidden="true"><div class="bloom ${colorClass}">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="center"></div><div class="stem"></div>
      </div></div>`;
    }

    function renderPlots() {
      el.plots.innerHTML = "";
      const plots = currentPlots();
      plots.forEach((plot) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "plot";
        btn.setAttribute("role", "gridcell");
        if (state.selectedPlot === plot.id) btn.classList.add("selected");
        if (plot.plant?.wateredToday) btn.classList.add("wet");

        let label = "空地";
        if (plot.plant) {
          const s = SEEDS[plot.plant.seedId];
          label = `${s.name}·${stageLabel[plot.plant.stage]}`;
        }
        btn.setAttribute("aria-label", `花圃 ${plot.id + 1}，${label}`);
        btn.innerHTML = `
          <div class="plot-inner">
            <div class="dew"></div>
            ${plantHTML(plot.plant)}
            <span class="plot-label">${label}</span>
          </div>
        `;
        btn.addEventListener("click", () => onPlotClick(plot.id));
        el.plots.appendChild(btn);
      });
      updateHud();
    }

    function updateHud() {
      el.coins.textContent = state.coins;
      el.energy.textContent = state.energy;
      el.energyMax.textContent = state.maxEnergy;
      el.day.textContent = state.day;
      const plots = currentPlots();
      const sel = state.selectedPlot != null ? plots[state.selectedPlot] : null;
      el.btnWater.disabled = !sel || !sel.plant || sel.plant.stage >= 2;
      el.btnHarvest.disabled = !sel || !sel.plant || sel.plant.stage < 2;
    }

    function renderAll() {
      renderRegionChrome();
      renderSeeds();
      renderPlots();
    }

    function onPlotClick(id) {
      const plots = currentPlots();
      const plot = plots[id];
      const region = currentRegion();
      state.selectedPlot = id;

      if (!plot.plant) {
        const seedId = state.selectedSeed;
        if (!region.seedIds.includes(seedId)) {
          toast("这种子不适合这里，换一颗吧");
          renderPlots();
          return;
        }
        const count = state.inventory[seedId] || 0;
        if (count <= 0) {
          toast("这种子用完了，收获后再来吧");
          renderPlots();
          return;
        }
        if (!spendEnergy(1)) {
          renderPlots();
          return;
        }
        state.inventory[seedId] -= 1;
        plot.plant = { seedId, stage: 0, wateredToday: false };
        log(`在「${region.name}」第 ${id + 1} 块地播下了「${SEEDS[seedId].name}」`);
        toast(`种下了 ${SEEDS[seedId].name}`);
        el.hint.textContent = "选中植株后点「浇水」，让它慢慢长大";
        renderSeeds();
        renderPlots();
        return;
      }

      el.hint.textContent =
        plot.plant.stage >= 2
          ? "这朵花已经盛开，可以收获了"
          : plot.plant.wateredToday
            ? "今天浇过水了，过夜后会继续生长"
            : "点下方「浇水」，帮它喝一口露珠";
      renderPlots();
    }

    el.btnWater.addEventListener("click", () => {
      if (state.selectedPlot == null) {
        toast("先点选一块有植株的地");
        return;
      }
      const plot = currentPlots()[state.selectedPlot];
      if (!plot.plant) {
        toast("空地还不需要浇水");
        return;
      }
      if (plot.plant.stage >= 2) {
        toast("已经盛开啦，直接收获吧");
        return;
      }
      if (plot.plant.wateredToday) {
        toast("今天已经浇过了，明天再来");
        return;
      }
      if (!spendEnergy(1)) return;

      plot.plant.wateredToday = true;
      log(`给「${SEEDS[plot.plant.seedId].name}」浇了一瓢清凉的水`);
      toast("浇水完成 ✧");
      el.hint.textContent = "土变湿了。点「过夜」，花会悄悄长大";

      const plotBtn = el.plots.children[state.selectedPlot];
      if (plotBtn) {
        plotBtn.classList.add("watering");
        setTimeout(() => plotBtn.classList.remove("watering"), 850);
      }
      renderPlots();
    });

    el.btnHarvest.addEventListener("click", () => {
      if (state.selectedPlot == null) {
        toast("先点选一朵盛开的花");
        return;
      }
      const plot = currentPlots()[state.selectedPlot];
      const region = currentRegion();
      if (!plot.plant || plot.plant.stage < 2) {
        toast("还没盛开，再等等");
        return;
      }
      if (!spendEnergy(1)) return;

      const seed = SEEDS[plot.plant.seedId];
      const gain = seed.cost + 4 + (region.harvestBonus || 0);
      const seedGain = 1 + (Math.random() > 0.55 ? 1 : 0);
      state.coins += gain;
      state.inventory[seed.id] = (state.inventory[seed.id] || 0) + seedGain;
      log(
        `在「${region.name}」收获「${seed.name}」，+${gain} 金币，种子 +${seedGain}`
      );
      toast(`收获啦 · +${gain} ◎`);
      plot.plant = null;
      el.hint.textContent = "花圃空出来了，可以再种一颗";
      renderSeeds();
      renderPlots();
    });

    el.btnRest.addEventListener("click", () => {
      state.day += 1;
      state.energy = state.maxEnergy;
      let grew = 0;
      let bonusGrew = 0;

      Object.values(REGIONS).forEach((region) => {
        const plots = state.regionPlots[region.id];
        plots.forEach((p) => {
          if (p.plant && p.plant.wateredToday && p.plant.stage < 2) {
            p.plant.stage += 1;
            p.plant.wateredToday = false;
            grew += 1;
            // 河岸：有概率多长一阶（仍不超过盛开）
            if (
              region.doubleGrowthChance &&
              p.plant.stage < 2 &&
              Math.random() < region.doubleGrowthChance
            ) {
              p.plant.stage += 1;
              bonusGrew += 1;
            }
          } else if (p.plant) {
            p.plant.wateredToday = false;
          }
        });
      });

      // unlock notices
      Object.values(REGIONS).forEach((region) => {
        if (region.unlockDay === state.day) {
          log(`地图更新：可以出游去「${region.name}」了`);
          toast(`解锁 ${region.name}`);
        }
      });

      let msg = grew
        ? `天亮了。各地共有 ${grew} 株植物又长高了一点`
        : "天亮了。今天的花圃静悄悄的";
      if (bonusGrew) msg += `（河岸额外抽芽 ${bonusGrew} 次）`;
      log(msg);
      toast(`第 ${state.day} 天 · 体力已回满`);
      el.hint.textContent = grew
        ? "有花长大了——别忘了别处的花圃"
        : "新的一天，浇浇水，或点「出游」去看看";
      renderAll();
    });

    el.btnTravel.addEventListener("click", openMap);
    el.btnCloseMap.addEventListener("click", closeMap);
    el.sheetMask.addEventListener("click", closeMap);
    el.btnTheme.addEventListener("click", toggleTheme);

    el.startBtn.addEventListener("click", () => {
      el.intro.classList.add("hide");
      log("推开院门，晨光落在南窗花圃上");
    });

    applyTheme(isNight());
    renderAll();
    log("小院已经准备好了。照料两天后，可以出游雾丘与河岸");
  </script>
</body>
</html>
