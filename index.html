<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>露珠小院</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
    background: #f5f5f5;
    min-height: 100vh;
    padding: 16px;
  }
  .app { max-width: 960px; margin: 0 auto; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .topbar h1 { font-size: 1.2rem; font-weight: 600; }
  .stats { display: flex; gap: 12px; font-size: 0.9rem; }
  .stage {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 12px;
  }
  .garden-panel, .card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
  }
  .garden-panel h2, .card h3 {
    font-size: 1rem;
    margin-bottom: 12px;
  }
  .hint { font-size: 0.8rem; color: #888; margin-bottom: 12px; }
  .plots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .plot {
    aspect-ratio: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #f0ebe3;
    cursor: pointer;
    font: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: #666;
  }
  .plot.selected { outline: 2px solid #4a90a4; }
  .seed-list { display: flex; flex-direction: column; gap: 8px; }
  .seed-btn {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 6px;
    padding: 8px 10px;
    text-align: left;
    cursor: pointer;
    font: inherit;
  }
  .seed-btn.active { border-color: #4a90a4; background: #eef6f8; }
  .log-body {
    font-size: 0.8rem;
    color: #666;
    max-height: 160px;
    overflow-y: auto;
  }
  .log-body p { margin-bottom: 6px; }
  .dock {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }
  .action {
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    font: inherit;
  }
  .action.primary {
    background: #4a90a4;
    border-color: #4a90a4;
    color: #fff;
  }
  .action:disabled { opacity: 0.45; cursor: not-allowed; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .intro {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: grid;
    place-items: center;
    z-index: 10;
  }
  .intro.hide { display: none; }
  .intro-card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: min(360px, 90vw);
    text-align: center;
  }
  .intro-card h2 { margin-bottom: 8px; }
  .intro-card p { color: #666; font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; }
  .intro-card .start {
    border: none;
    background: #4a90a4;
    color: #fff;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
  }
  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="intro" id="intro">
    <div class="intro-card">
      <h2>露珠小院</h2>
      <p>选种子、点空地播种，浇水过夜后收获。</p>
      <button class="start" id="startBtn" type="button">开始</button>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <h1>露珠小院</h1>
      <div class="stats">
        <span>金币 <span id="coins">48</span></span>
        <span>体力 <span id="energy">12</span>/16</span>
        <span>第 <span id="day">1</span> 天</span>
      </div>
    </header>

    <main class="stage">
      <section class="garden-panel">
        <h2>南窗花圃</h2>
        <p class="hint" id="statusHint">先选种子，再点空地播种</p>
        <div class="plots" id="plots"></div>
      </section>
      <aside>
        <div class="card" style="margin-bottom:12px">
          <h3>种子袋</h3>
          <div class="seed-list" id="seedList"></div>
        </div>
        <div class="card">
          <h3>小院手记</h3>
          <div class="log-body" id="log"></div>
        </div>
      </aside>
    </main>

    <nav class="dock">
      <button class="action" id="btnWater" type="button">浇水</button>
      <button class="action primary" id="btnHarvest" type="button">收获</button>
      <button class="action" id="btnRest" type="button">过夜</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 结构占位：交互逻辑在后续提交中补齐
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("intro").classList.add("hide");
    });
    const plots = document.getElementById("plots");
    for (let i = 0; i < 9; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "plot";
      b.textContent = "空地";
      plots.appendChild(b);
    }
    const seedList = document.getElementById("seedList");
    ["胭脂芽 ×3", "薄荷铃 ×2"].forEach((name, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "seed-btn" + (i === 0 ? " active" : "");
      b.textContent = name;
      seedList.appendChild(b);
    });
    document.getElementById("log").innerHTML = "<p>小院结构已搭好，等待玩法接入</p>";
  </script>
</body>
</html>
